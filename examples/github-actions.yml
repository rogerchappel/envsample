name: envsample

on:
  pull_request:
  push:
    branches: [main]

jobs:
  envsample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx envsample validate . --example .env.example --fail-on-stale
